        var aText = [
            "Becoming a full-stack developer is a rewarding journey that involves mastering both front-end and back-end technologies. Below is a step-by-step guide to help you get started."
        ];
        var iSpeed = 50; // time delay of print out (adjust as needed)
        var iIndex = 0; // start printing array at this position
        var iScrollAt = 20; // start scrolling up at this many lines

        var iTextPos = 0; // initialise text position
        var sContents = ''; // initialise contents variable
        var iRow; // initialise current row
        var words = aText[0].split(" "); // Split text into words
        var iWordIndex = 0;

        function typewriter() {
            var destination = document.getElementById("typedtext");

            if (iWordIndex < words.length) {
                sContents += words[iWordIndex] + " ";
                destination.innerHTML = sContents + "_"; // Cursor effect
                iWordIndex++;
                setTimeout(typewriter, iSpeed);
            } else {
                destination.innerHTML = sContents; // Remove cursor when done
            }
        }

        typewriter();

        const recordBtn = document.getElementById("recordBtn");
        recordBtn.addEventListener("click", () => {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = "en-US";
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let transcript = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                console.log("Recognized text:", transcript);
            };

            recognition.start();
        })
